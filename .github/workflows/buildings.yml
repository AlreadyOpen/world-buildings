# Every building with a height, every field (buildings.py). Manual for now: a probe (some Overture files, no publish) or the world.
name: buildings
on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Probe: only these Overture files (e.g. 00058); empty = the whole world'
        type: string
        default: ''
      target:
        description: 'Buildings with a height per region job'
        type: string
        default: '15000000'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      SKY_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - id: plan
        run: echo "matrix=$(python buildings.py plan --target '${{ inputs.target }}' ${{ inputs.files && format('--files {0}', inputs.files) || '' }} | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: plan
          path: |
            data/out/plan.json
            data/cache/
  region:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SKY_DATA: ${{ github.workspace }}/data
    steps:
      - name: free disk (preinstalled toolchains this job does not use)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      # tippecanoe 2.79.0 from source: apt's 2.49 drops most buildings and never extends past z13 (probe 2026-10-10:
      # 5,295 features at z13 for 4,076,035 rows); 2.79 keeps every building at z14 (local Manhattan test).
      - id: tip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: /opt/tippecanoe
          key: tippecanoe-2.79.0-ubuntu-24.04
      - if: steps.tip.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q libsqlite3-dev zlib1g-dev
          git clone -q https://github.com/felt/tippecanoe /tmp/tip && git -C /tmp/tip checkout -q 68ab8dcc229f95b8b25877697d5e8d66783af503
          make -C /tmp/tip -j"$(nproc)" PREFIX=/opt/tippecanoe && sudo make -C /tmp/tip install PREFIX=/opt/tippecanoe
      - run: echo /opt/tippecanoe/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: plan
          path: data
      - name: region
        run: |
          /usr/bin/time -v python buildings.py region ${{ matrix.region }} 2> time.txt && rc=0 || rc=$?
          grep -vE '^\s' time.txt | tail -40; grep -E 'Elapsed|Maximum resident' time.txt; df -h / | tail -1; du -sh data/out/*
          tippecanoe --version 2>&1; tippecanoe-decode -c data/out/${{ matrix.region }}.pmtiles 2>/dev/null | grep -o '"maxzoom": [0-9]*' | sort | uniq -c
          exit $rc
