# Every building with a height, every field (buildings.py). Manual for now: a probe (some Overture files, no publish) or the world.
name: buildings
on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Probe: only these Overture files (e.g. 00058); empty = the whole world'
        type: string
        default: ''
      target:
        description: 'Buildings with a height per region job'
        type: string
        default: '15000000'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      SKY_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - id: plan
        run: echo "matrix=$(python buildings.py plan --target '${{ inputs.target }}' ${{ inputs.files && format('--files {0}', inputs.files) || '' }} | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: plan
          path: |
            data/out/plan.json
            data/cache/
  region:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SKY_DATA: ${{ github.workspace }}/data
    steps:
      - name: free disk (preinstalled toolchains this job does not use)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get update -q && sudo apt-get install -y -q tippecanoe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: plan
          path: data
      - name: region
        run: |
          /usr/bin/time -v python buildings.py region ${{ matrix.region }} 2> time.txt; rc=$?
          grep -E 'Elapsed|Maximum resident' time.txt; df -h / | tail -1; du -sh data/out/*
          exit $rc
